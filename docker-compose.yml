name: nexora

services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    networks: [nexora]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-nexora_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-local_admin_change_me}
      - POSTGRES_DB=postgres
      - AUTH_DB_PASSWORD=${AUTH_DB_PASSWORD:-local_auth_change_me}
      - CATALOG_DB_PASSWORD=${CATALOG_DB_PASSWORD:-local_catalog_change_me}
      - ORDER_DB_PASSWORD=${ORDER_DB_PASSWORD:-local_order_change_me}
      - PAYMENT_DB_PASSWORD=${PAYMENT_DB_PASSWORD:-local_payment_change_me}
      - NOTIFICATION_DB_PASSWORD=${NOTIFICATION_DB_PASSWORD:-local_notification_change_me}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  api-gateway:
    networks: [nexora]
    image: nexora-api-gateway:dev
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3000
      AUTH_INTERNAL_TOKEN: ${AUTH_INTERNAL_TOKEN:-local-development-internal-service-token-change-this}
      CATALOG_SERVICE_URL: http://catalog-service:3000
      ORDER_SERVICE_URL: http://order-service:3000
      PAYMENT_SERVICE_URL: http://payment-service:3000
      NOTIFICATION_SERVICE_URL: http://notification-service:3000
    ports:
      - '${GATEWAY_PORT:-3000}:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |-
          fetch('http://127.0.0.1:3000/health')
            .then(response => process.exit(response.ok ? 0 : 1))
            .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
  auth-service:
    networks: [nexora]
    image: nexora-auth-service:dev
    build:
      context: ./auth-service
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: auth_db
      DB_USER: auth_user
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-local_auth_change_me}
      AUTH_ACCESS_SECRET: ${AUTH_ACCESS_SECRET:-local-development-access-secret-change-this}
      AUTH_REFRESH_SECRET: ${AUTH_REFRESH_SECRET:-local-development-refresh-secret-change-this}
      AUTH_INTERNAL_TOKEN: ${AUTH_INTERNAL_TOKEN:-local-development-internal-service-token-change-this}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - '3001:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |-
          fetch('http://127.0.0.1:3000/health')
            .then(response => process.exit(response.ok ? 0 : 1))
            .catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

